name: Test

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check version consistency
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        echo "Tag Version: $TAG_VERSION"
        HEADER_VERSION=$(grep -E '^[[:space:]]*;;[[:space:]]*Version:[[:space:]]*' mac-ime.el | sed -E 's/.*Version:[[:space:]]*//' | tr -d '\r')
        echo "Header Version: $HEADER_VERSION"
        VAR_VERSION=$(grep -E '^[[:space:]]*\(defconst[[:space:]]+mac-ime-version[[:space:]]+' mac-ime.el | sed -E 's/.*mac-ime-version[[:space:]]+"([^"]+)".*/\1/' | tr -d '\r')
        echo "Variable Version: $VAR_VERSION"
        if [ "$TAG_VERSION" != "$HEADER_VERSION" ]; then
          echo "Error: Git tag version ($TAG_VERSION) does not match mac-ime.el Header Version ($HEADER_VERSION)"
          exit 1
        fi
        if [ "$TAG_VERSION" != "$VAR_VERSION" ]; then
          echo "Error: Git tag version ($TAG_VERSION) does not match mac-ime-version variable ($VAR_VERSION)"
          exit 1
        fi
        echo "Success: All version numbers match!"

    - name: Setup Emacs
      uses: purcell/setup-emacs@master
      with:
        version: '29.3'

    - name: Run tests
      run: make test
